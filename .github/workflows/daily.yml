name: daily-ingestion
on:
  schedule:
    - cron: '25 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: commodity-data-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.11'
      - run: uv sync --frozen
      - name: Restore last archive, including prior observation vintages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=commodity-history&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/history.zip
            mkdir -p data
            unzip -q /tmp/history.zip -d data
          fi
      - name: Refresh public sources and available authenticated sources
        env:
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: uv run commodity-data refresh
      - name: Export catalogue
        if: ${{ !cancelled() }}
        run: uv run commodity-data export-catalog data/catalog.html
      - name: Write public refresh status
        if: ${{ success() }}
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/health.json").read_text())
          lines = [
              "# Automated refresh status",
              "",
              "This file is updated by the daily GitHub Actions refresh. It contains no raw market data or credentials.",
              "",
              f"Last successful refresh: `{report['generated_at']}`",
              "",
              "| Source | Status | Rows | New review alerts |",
              "| --- | --- | ---: | ---: |",
          ]
          for source in report["sources"]:
              lines.append(
                  f"| {source['source']} | {source['status']} | {source['rows']:,} | {source['new_alerts']} |"
              )
          blockers = report["completion_blockers"]
          if blockers:
              lines += ["", "## Remaining completion gates", ""]
              lines += [f"- {item}" for item in blockers]
          Path("docs/RUN_STATUS.md").write_text("\n".join(lines) + "\n")
          PY
      - name: Commit refresh status
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RUN_STATUS.md
          git diff --cached --quiet || git commit -m "chore: daily data refresh status"
          git push
      - name: Preserve history and reports even when checks fail
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: commodity-history
          path: data/
          retention-days: 90
          if-no-files-found: error
